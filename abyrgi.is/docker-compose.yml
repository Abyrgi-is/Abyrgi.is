# Development Docker Compose
version: '3.8'

services:
  abyrgi-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: abyrgi-dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    # volumes:
      # Optional: Mount for hot reload in dev (if needed)
      # - ./src:/app/src:ro
      # - ./public:/app/public:ro
    networks:
      - abyrgi-network

networks:
  abyrgi-network:
    driver: bridge
